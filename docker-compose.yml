services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    volumes:
      - ~/backups/comfyui_queue.db:/app/comfyui_queue.db:z
      - /home/david/projects/RawMaterials:/home/david/projects/RawMaterials:z
      - ~/backups/video_output:/app/output:z
      - /home/david/projects/wan22-video-generator/backend/output:/home/david/projects/wan22-video-generator/backend/output:z
      - ~/backups/lora_previews:/app/lora_previews:z
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  react-app:
    build:
      context: ./react-app
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    environment:
      - VITE_API_URL=http://backend:9090
    depends_on:
      - backend
    restart: unless-stopped

